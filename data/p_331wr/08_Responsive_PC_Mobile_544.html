<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Responsive PC & Mobile - 상품 상세 - 리뉴얼 2차</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root { --v4-primary: #6366f1; --v4-accent: #00e5ff; --v4-bg: #1e293b; --v4-frame-bg: #ffffff; --v4-text: #f8fafc; --v4-border: rgba(255, 255, 255, 0.15); }
        body { margin: 0; padding: 0; background: var(--v4-bg); font-family: 'Inter', 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: var(--v4-text); background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; }
        .page { width: 1440px; height: 900px; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.5); overflow: hidden; display: flex; justify-content: center; align-items: center; gap: 36px; box-sizing: border-box; }
        .pc-browser-frame { width: 890px; height: 838px; background: #ffffff; display: flex; flex-direction: column; border-radius: 16px; border: 1.6px solid rgba(0, 0, 0, 0.12) !important; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); overflow: hidden; position: relative; box-sizing: border-box; }
        .pc-browser-header { background: #dee1e6; padding: 8px 8px 0 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1.6px solid #cbcbd0 !important; user-select: none; pointer-events: none; }
        .pc-browser-top-bar { display: flex; align-items: center; gap: 12px; }
        .pc-browser-dots { display: flex; gap: 8px; margin-left: 8px; }
        .pc-browser-dot { width: 12px; height: 12px; border-radius: 50%; }
        .pc-browser-dot.red { background: #ff5f56; }
        .pc-browser-dot.yellow { background: #ffbd2e; }
        .pc-browser-dot.green { background: #27c93f; }
        .pc-browser-tabs { display: flex; align-items: flex-end; margin-left: 16px; }
        .pc-browser-tab { background: #ffffff; border-radius: 8px 8px 0 0; padding: 6px 16px; font-size: 11px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 8px; height: 28px; box-sizing: border-box; }
        .pc-tab-close { color: #999; font-size: 11px; cursor: pointer; }
        .pc-browser-nav-bar { background: #ffffff; padding: 6px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1.6px solid #e5e7eb !important; pointer-events: none; }
        .pc-nav-btn { color: #5f6368; cursor: pointer; display: flex; align-items: center; }
        .pc-browser-url-bar { flex: 1; background: #f1f3f4; border-radius: 14px; height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #5f6368; gap: 8px; border: 1px solid transparent; }
        .pc-content-area { flex: 1; width: 100%; background: #ffffff; position: relative; background-image: linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px); background-size: 20px 20px; overflow: hidden; box-sizing: border-box; }
        .mobile-frame { width: 375px; height: 838px; background: var(--v4-frame-bg); border-radius: 40px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 0 8px #111; overflow: hidden; border: 4px solid #334155; box-sizing: border-box; flex-shrink: 0; }
        .mobile-header-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 30px; background: #111; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 1000; }
        .mobile-content { width: 360px; height: 800px; position: absolute; top: 30px; left: 7.5px; background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px); background-size: 20px 20px; overflow-y: auto; overflow-x: hidden; border: none !important; box-sizing: border-box; }
        .mobile-statusbar { position: absolute; top: 10px; left: 24px; right: 24px; height: 20px; display: flex; align-items: center; justify-content: space-between; color: #111827; font-size: 12px; font-weight: 800; z-index: 1001; pointer-events: none; white-space: nowrap; }
        .mobile-home-indicator { position: absolute; bottom: 8px; left: 50%; width: 132px; height: 5px; border-radius: 999px; background: #111827; transform: translateX(-50%); z-index: 1001; pointer-events: none; }
        .lf-component { position: absolute !important; box-sizing: border-box !important; z-index: 500; }
    </style>
</head>
<body>
    <div class="page">
        <div class="pc-browser-frame">
            <div class="pc-browser-header">
                <div class="pc-browser-top-bar">
                    <div class="pc-browser-dots"><div class="pc-browser-dot red"></div><div class="pc-browser-dot yellow"></div><div class="pc-browser-dot green"></div></div>
                    <div class="pc-browser-tabs"><div class="pc-browser-tab"><span class="material-icons-outlined" style="font-size: 14px; color: #6366f1;">shopping_bag</span><span style="font-family: inherit;">LFmall | PC Web</span><span class="pc-tab-close">&times;</span></div></div>
                </div>
                <div class="pc-browser-nav-bar">
                    <span class="material-icons-outlined pc-nav-btn" style="font-size: 18px;">arrow_back</span>
                    <span class="material-icons-outlined pc-nav-btn" style="font-size: 18px;">arrow_forward</span>
                    <span class="material-icons-outlined pc-nav-btn" style="font-size: 18px;">refresh</span>
                    <div class="pc-browser-url-bar"><span class="material-icons-outlined" style="font-size: 14px; color: #10b981;">lock</span><span>https://www.lfmall.co.kr</span></div>
                    <span class="material-icons-outlined pc-nav-btn" style="font-size: 18px;">more_vert</span>
                </div>
            </div>
            <div class="pc-content-area"></div>
        </div>
        <div class="mobile-frame">
            <div class="mobile-statusbar"><span>9:41</span><span>5G 100%</span></div>
            <div class="mobile-header-notch"></div>
            <div class="mobile-content"></div>
            <div class="mobile-home-indicator"></div>
        </div>
    </div>
</body>
</html>
