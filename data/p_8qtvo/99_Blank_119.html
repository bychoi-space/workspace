<!DOCTYPE html>
<html lang="ko" style="--v4-text-color: #0f172a; --v4-font-size: 12px; --v4-font-weight: 400; --v4-font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; --v4-placeholder-color: #94a3b8;"><head>
    <meta charset="UTF-8">
    <title>Blank Screen - [Front Renewal] 주문</title>
    <link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --v4-primary: #6366f1;
            --v4-accent: #00e5ff;
            --v4-bg: #1e293b;
            --v4-surface: #f8f9fa;
            --v4-border: #e1e3e5;
            --v4-text: #1a1c1e;
        }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Pretendard Variable', Pretendard, 'Inter', 'Noto Sans KR', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: var(--v4-bg); 
            overflow: hidden; color: var(--v4-text);
        }
        .page { 
            width: 1600px; height: 900px; 
            position: relative; 
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.02) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.03) 0%, transparent 50%);
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
            overflow: hidden;
        }
    </style>
    

</head>
