                    <div id="v4-comp-1794556779453_874405_0" class="lf-component" data-resized="true" style="position: absolute; top: 0px; left: 0px; z-index: 1010; transform: none; width: 360px; height: 810px;">
            <div class="v4-shape v4-shape-rect" style="width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; color: var(--v4-text-color, #0f172a); overflow: hidden; box-sizing: border-box; border-width: 1.6px !important; border-radius: 0px !important;" data-corner-dir="all">
                <div contenteditable="true" class="v4-editable-cell" style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px 10px; box-sizing: border-box; text-align: center; outline: none; font-weight: 400; font-size: 12px; word-break: break-word; overflow-wrap: break-word; white-space: pre-wrap;"></div>

    <div class="v4-pin-layer" style="position: absolute; top: 0px; left: 0px; width: 100%; height: 100%; pointer-events: none; z-index: 250000 !important;"></div></div>
    <script>
        (function() {
            function initHeightControls() {
                const pcInput = document.querySelector('.pc-height-input');
                const pcInner = document.querySelector('.pc-content-inner');
                if (pcInput && pcInner) {
                    const updatePc = () => {
                        const val = Math.max(810, parseInt(pcInput.value) || 810);
                        pcInner.style.minHeight = (val + 2) + 'px';
                        pcInput.setAttribute('value', val);
                    };
                    pcInput.addEventListener('input', updatePc);
                    pcInput.addEventListener('change', updatePc);
                    updatePc();
                }
                const mobileInput = document.querySelector('.mobile-height-input');
                const mobileInner = document.querySelector('.mobile-content-inner');
                if (mobileInput && mobileInner) {
                    const updateMobile = () => {
                        const val = Math.max(810, parseInt(mobileInput.value) || 810);
                        mobileInner.style.minHeight = (val + 2) + 'px';
                        mobileInput.setAttribute('value', val);
                    };
                    mobileInput.addEventListener('input', updateMobile);
                    mobileInput.addEventListener('change', updateMobile);
                    updateMobile();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHeightControls);
            } else {
                initHeightControls();
            }
        })();
    </script>
