            <div class="pc-browser-frame active-frame full-width">

                        </div>

            </div></div><div id="lf-comp-1788499350181" class="lf-component" style="position: absolute; top: 12.5px; left: 207px; z-index: 1000; transform: none; height: 25px; color: rgb(0, 0, 0); width: 25px !important;" data-resized="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="lf-icon" style="width: 100%; height: 100%; padding: 3px; box-sizing: border-box; background-image: none !important; color: rgb(255, 255, 255);"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div><div id="v4-comp-1788499699420" class="lf-component" style="position: absolute; top: 0px; left: 250px; z-index: 1000; transform: none; width: 1310px; height: 50px;" data-resized="true">

            </div>

    </div>
    <script>
        (function() {
            function initHeightControls() {
                const pcInput = document.querySelector('.pc-height-input');
                const pcInner = document.querySelector('.pc-content-inner');
                if (pcInput && pcInner) {
                    const updatePc = () => {
                        const val = Math.max(810, parseInt(pcInput.value) || 810);
                        pcInner.style.minHeight = (val + 2) + 'px';
                        pcInput.setAttribute('value', val);
                    };
                    pcInput.addEventListener('input', updatePc);
                    pcInput.addEventListener('change', updatePc);
                    updatePc();
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initHeightControls);
            } else {
                initHeightControls();
            }
        })();
    </script>
